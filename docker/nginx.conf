server {
    listen 80;
    root /usr/share/nginx/html;
    # Re-resolve via Docker DNS so a recreated backend container (new IP)
    # doesn't leave nginx proxying to a stale address.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        # $http_host keeps the port, so FastAPI's trailing-slash redirects
        # point back at the published web port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Agent replies stream over SSE: don't buffer, allow long turns.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        client_max_body_size 100m;
    }

    # SPA: unknown paths fall back to the client router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
